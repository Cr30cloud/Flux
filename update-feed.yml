name: Mise à jour du flux RSS Nîmes/Gard

on:
  schedule:
    # Toutes les 15 minutes. Décalé de quelques minutes par rapport à
    # l'heure pile pour éviter les pics de charge de GitHub Actions.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}   # permet aussi de le lancer manuellement (bouton "Run workflow")

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le flux (feed.xml)
        run: python generate_feed.py

      - name: Publier le flux si son contenu a changé
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "Mise à jour automatique du flux ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
